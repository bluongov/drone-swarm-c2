<text x="802.2" y="632" text-anchor="middle" font-size="12.5" fill="#e6edf7">telemetry (hypertable)</text>
<text x="395" y="680" font-size="12" fill="#8fa3bf">site_layers: height grid, land cover, CAC formulas (JSONB), buildings</text>
<text x="395" y="700" font-size="12" fill="#8fa3bf">no_fly_zones: PostGIS polygons, ST_Intersects(route, nfz) at mission start</text>
<text x="395" y="720" font-size="12" fill="#8fa3bf">telemetry: ts, drone_id, lat, lon, alt, vel, heading, battery, state</text>
