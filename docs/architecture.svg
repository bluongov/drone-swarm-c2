<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e6edf7"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#e6edf7"/></marker></defs>
<rect width="1400" height="800" fill="#0b1220"/>
<text x="40" y="46" font-size="24" font-weight="700" fill="#e6edf7">Drone Swarm C2 · target architecture (v1)</text>
<text x="40" y="68" font-size="13" fill="#8fa3bf">Server owns drone + mission state · DB holds maps and telemetry history · frontend renders. Solid = v1, dashed = later / existing offline mode.</text>
<rect x="40" y="130" width="260" height="100" rx="10" fill="#111b2e" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/>
<text x="170.0" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">REAL DRONE</text>
<text x="170.0" y="172" text-anchor="middle" font-size="12" fill="#e6edf7">MAVLink on companion computer</text>
<text x="170.0" y="188" text-anchor="middle" font-size="12" fill="#e6edf7">bridge → MQTT / HTTP</text>
<text x="170.0" y="204" text-anchor="middle" font-size="12" fill="#e6edf7">(phase 4, not in v1)</text>
<rect x="40" y="290" width="260" height="110" rx="10" fill="#111b2e" stroke="#38bdf8" stroke-width="2"/>
<text x="170.0" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#38bdf8">SIM DRONES</text>
<text x="170.0" y="332" text-anchor="middle" font-size="12" fill="#e6edf7">SimWorld = shared sim-core.js</text>
<text x="170.0" y="348" text-anchor="middle" font-size="12" fill="#e6edf7">real flocking code, 30 Hz tick</text>
<text x="170.0" y="364" text-anchor="middle" font-size="12" fill="#e6edf7">same ingest path as real drones</text>
<rect x="40" y="450" width="260" height="120" rx="10" fill="#111b2e" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/>
<text x="170.0" y="472" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">LATER</text>
<text x="170.0" y="492" text-anchor="middle" font-size="12" fill="#e6edf7">MQTT broker + MAVLink bridge</text>
<text x="170.0" y="508" text-anchor="middle" font-size="12" fill="#e6edf7">BRAVO / hostile wiring in</text>
<text x="170.0" y="524" text-anchor="middle" font-size="12" fill="#e6edf7">server mode, auth, deploy</text>
<text x="170.0" y="540" text-anchor="middle" font-size="12" fill="#e6edf7">optional: Rust sim core</text>
<text x="170" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1">DATA SOURCES</text>
