<text x="485.0" y="338" text-anchor="middle" font-size="12" fill="#e6edf7">→ DONE | ABORTED</text>
<text x="485.0" y="354" text-anchor="middle" font-size="12" fill="#e6edf7">route check: terrain</text>
<text x="485.0" y="370" text-anchor="middle" font-size="12" fill="#e6edf7">+ NFZ polygons (PostGIS)</text>
<rect x="605" y="280" width="180" height="110" rx="10" fill="#111b2e" stroke="#34d399" stroke-width="2"/>
<text x="695.0" y="302" text-anchor="middle" font-size="14" font-weight="700" fill="#34d399">REST API</text>
<text x="695.0" y="322" text-anchor="middle" font-size="12" fill="#e6edf7">GET /api/sites/:id</text>
<text x="695.0" y="338" text-anchor="middle" font-size="12" fill="#e6edf7">POST /api/missions</text>
<text x="695.0" y="354" text-anchor="middle" font-size="12" fill="#e6edf7">POST …/start | abort</text>
<rect x="815" y="280" width="180" height="70" rx="10" fill="#111b2e" stroke="#34d399" stroke-width="2"/>
<text x="905.0" y="302" text-anchor="middle" font-size="14" font-weight="700" fill="#34d399">BATCH WRITER</text>
