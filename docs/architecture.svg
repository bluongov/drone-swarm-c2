<text x="386" y="124" font-size="13" font-weight="700" fill="#34d399" letter-spacing="1">SERVER · Node 26 + TypeScript · Fastify + ws · :3000</text>
<rect x="395" y="150" width="180" height="80" rx="10" fill="#111b2e" stroke="#34d399" stroke-width="2"/>
<text x="485.0" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#34d399">INGEST</text>
<text x="485.0" y="192" text-anchor="middle" font-size="12" fill="#e6edf7">POST/WS /ingest</text>
<text x="485.0" y="208" text-anchor="middle" font-size="12" fill="#e6edf7">validate + normalize</text>
<rect x="605" y="150" width="180" height="80" rx="10" fill="#111b2e" stroke="#34d399" stroke-width="2"/>
<text x="695.0" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#34d399">STATE BUS</text>
<text x="695.0" y="192" text-anchor="middle" font-size="12" fill="#e6edf7">last state per drone</text>
<text x="695.0" y="208" text-anchor="middle" font-size="12" fill="#e6edf7">+ event stream</text>
<rect x="815" y="150" width="180" height="80" rx="10" fill="#111b2e" stroke="#34d399" stroke-width="2"/>
<text x="905.0" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#34d399">WS GATEWAY</text>
<text x="905.0" y="192" text-anchor="middle" font-size="12" fill="#e6edf7">/live  ~10 Hz snapshots</text>
<text x="905.0" y="208" text-anchor="middle" font-size="12" fill="#e6edf7">+ mission events</text>
<rect x="395" y="280" width="180" height="110" rx="10" fill="#111b2e" stroke="#34d399" stroke-width="2"/>
